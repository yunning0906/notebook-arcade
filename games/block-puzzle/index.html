<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notebook Block Puzzle - 手帳方塊拼圖</title>
    <meta name="description" content="在手帳方格紙上擺放無黑邊莫蘭迪幾何純色方塊，享受清脆木琴琶音與治癒粒子消除體驗。">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">
        <!-- 頂部資訊與計分區 -->
        <header class="game-header">
            <div class="title-group">
                <h1 class="game-title">BLOCK PUZZLE</h1>
                <p class="game-subtitle">Notebook 10×10 & 8×8</p>
            </div>
            <div class="score-board">
                <div class="score-box">
                    <span class="score-label">SCORE</span>
                    <span id="currentScore" class="score-num">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">BEST</span>
                    <span id="bestScore" class="score-num">0</span>
                </div>
            </div>
        </header>

        <!-- 工具列：模式切換與快捷控制 -->
        <section class="toolbar" aria-label="Game Controls">
            <div class="mode-selector">
                <button type="button" class="btn-mode active" data-size="10" title="10x10 經典手帳">10×10</button>
                <button type="button" class="btn-mode" data-size="8" title="8x8 緊湊手帳">8×8</button>
            </div>

            <div class="action-buttons">
                <button type="button" id="btnReroll" class="icon-btn" title="Reroll shapes" aria-label="Reroll shapes">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8" cy="8" r="1.5" fill="currentColor"></circle><circle cx="16" cy="8" r="1.5" fill="currentColor"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor"></circle><circle cx="8" cy="16" r="1.5" fill="currentColor"></circle><circle cx="16" cy="16" r="1.5" fill="currentColor"></circle></svg>
                </button>
                <button type="button" id="btnToggleSFX" class="icon-btn active" title="Sound Effects" aria-label="Toggle Sound Effects">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
                <button type="button" id="btnToggleBGM" class="icon-btn" title="Music Box BGM" aria-label="Toggle Music Box BGM">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </button>
                <button type="button" id="btnHeaderRestart" class="icon-btn" title="Restart Game" aria-label="Restart Game">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M23 20v-6h-6"></path><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                </button>
            </div>
        </section>

        <!-- 方格紙棋盤主區域 -->
        <div class="board-wrapper">
            <canvas id="particleCanvas" class="particle-canvas"></canvas>
            <div id="puzzleBoard" class="puzzle-board" role="grid" aria-label="Puzzle Grid"></div>
        </div>

        <!-- 底部手牌 3 個方塊托盤 -->
        <section id="handSlots" class="hand-tray" aria-label="Hand shapes tray">
            <!-- 3 slots injected dynamically -->
        </section>
    </main>

    <!-- 遊戲結束結算彈窗 -->
    <div id="gameOverModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
        <div class="modal-card">
            <h2 id="gameOverTitle" class="modal-title">GAME OVER</h2>
            <div id="newBestBadge" class="badge-new-best" style="display: none;">NEW RECORD</div>
            
            <div class="modal-stats">
                <div class="modal-stat-item">
                    <span class="modal-stat-label">SCORE</span>
                    <span id="finalScore" class="modal-stat-value">0</span>
                </div>
                <div class="modal-stat-item">
                    <span class="modal-stat-label">BEST</span>
                    <span id="bestRecord" class="modal-stat-value">0</span>
                </div>
            </div>

            <button type="button" id="btnRestart" class="btn-primary">PLAY AGAIN</button>
        </div>
    </div>

    <!-- 模組載入 -->
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/shapes.js"></script>
    <script src="js/board.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
