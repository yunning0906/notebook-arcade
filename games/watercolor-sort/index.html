<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水彩試管倒水 · Watercolor Sort Puzzle</title>
    <meta name="description" content="療癒系手繪水彩試管倒水益智遊戲。搭配逼真水流氣泡音效與音樂盒BGM，慢節奏無壓力，將抹茶綠、芋泥紫、奶杏粉等水彩集中同管。">
    <link rel="stylesheet" href="style.css?v=macaron_20260921_1">
</head>
<body>
    <!-- Main Game Container -->
    <main class="game-container">
        <!-- 1. Header Area -->
        <header class="game-header">
            <div class="title-group">
                <h1 class="game-title">水彩試管倒水</h1>
                <p class="game-subtitle">Watercolor Sort · 慢節奏療癒調色</p>
            </div>

            <div class="header-actions">
                <!-- Sound & BGM Toggle -->
                <button class="icon-btn" id="soundToggleBtn" aria-label="切換音效與音樂" title="聲音開關">
                    <svg class="icon-svg" id="soundIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <svg class="icon-svg hidden" id="soundIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>

                <!-- Level Select Button -->
                <button class="icon-btn" id="levelSelectBtn" aria-label="選關畫廊" title="關卡選單">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </button>

                <!-- Help Button -->
                <button class="icon-btn" id="helpBtn" aria-label="玩法說明" title="遊戲玩法">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 2. Level Banner -->
        <section class="level-banner">
            <span class="level-badge" id="levelNumberDisplay">LEVEL 1</span>
            <span class="level-title" id="levelTitleDisplay">初探薄荷與蜜桃</span>
        </section>

        <!-- 3. Desk Stage & Test Tubes -->
        <section class="desk-stage">
            <!-- Dynamic Test Tubes Container -->
            <div class="tubes-container layout-compact" id="tubesContainer">
                <!-- Dynamically generated by ui.js -->
            </div>

            <!-- Wooden Tube Rack Base -->
            <div class="wooden-rack"></div>
        </section>

        <!-- 4. Bottom Relaxation Toolbar -->
        <nav class="toolbar">
            <!-- Undo Button -->
            <button class="tool-btn" id="undoBtn" aria-label="復原上一步" title="復原一步">
                <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 14L4 9l5-5"></path>
                    <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"></path>
                </svg>
                <span>復原</span>
            </button>

            <!-- Restart Button -->
            <button class="tool-btn" id="restartBtn" aria-label="重置關卡" title="重新開始">
                <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                <span>重置</span>
            </button>

            <!-- Add Extra Tube Button -->
            <button class="tool-btn" id="addTubeBtn" aria-label="增加備用試管" title="增加一根空試管">
                <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 2h10"></path>
                    <path d="M9 2v14a3 3 0 0 0 6 0V2"></path>
                </svg>
                <span>+試管</span>
                <span class="btn-badge" id="addTubeBadge">2</span>
            </button>

            <!-- Hint Button -->
            <button class="tool-btn" id="hintBtn" aria-label="提示下一步" title="獲得下一步提示">
                <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18h6"></path>
                    <path d="M10 22h4"></path>
                    <path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z"></path>
                </svg>
                <span>提示</span>
            </button>
        </nav>
    </main>

    <!-- Notification Toast -->
    <div class="toast-notice hidden" id="toastNotice"></div>

    <!-- SVG Pouring Stream (Full Screen Overlay) -->
    <svg class="pour-stream-svg" id="pourStreamSvg">
        <path class="stream-path" id="streamPath" d="M 0 0" />
    </svg>

    <!-- Canvas for Bubbling Micro-Particles -->
    <canvas class="particle-canvas" id="particleCanvas"></canvas>

    <!-- MODAL 1: VICTORY CARD -->
    <div class="modal-overlay hidden" id="victoryModal">
        <div class="modal-card">
            <div class="modal-stamp">調色完成</div>
            <h2 class="modal-title">色彩歸位</h2>
            <p class="modal-desc" id="victoryLevelTitle">第 1 關 · 初探薄荷與蜜桃</p>
            <div class="modal-actions">
                <button class="btn-secondary" id="victoryReplayBtn">再次品味</button>
                <button class="btn-primary" id="nextLevelBtn">下一關 ➔</button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: LEVEL SELECTOR -->
    <div class="modal-overlay hidden" id="levelSelectModal">
        <div class="modal-card">
            <button class="modal-close-btn" aria-label="關閉選單">✕</button>
            <div class="modal-stamp">調色筆記</div>
            <h2 class="modal-title">選擇關卡</h2>
            <p class="modal-desc">收錄 36 幅手繪水彩調色試驗</p>
            <div class="level-grid" id="levelGrid">
                <!-- Generated by js/ui.js -->
            </div>
        </div>
    </div>

    <!-- MODAL 3: HELP & RULES -->
    <div class="modal-overlay hidden" id="helpModal">
        <div class="modal-card">
            <button class="modal-close-btn" aria-label="關閉說明">✕</button>
            <div class="modal-stamp">玩法規則</div>
            <h2 class="modal-title">如何調配水彩？</h2>
            <ul class="help-list">
                <li>點選任意試管將其拿取，再點選目標試管即可互相傾倒水彩。</li>
                <li>只能倒在<strong>頂層相同色彩</strong>的試管中，或是倒入<strong>完全為空的試管</strong>。</li>
                <li>目標試管必須還有足夠的容量空間（每支試管容量為 4 格）。</li>
                <li>當一支試管集滿 4 格相同水彩時，會自動蓋上軟木塞。</li>
                <li>沒有倒數計時與步數懲罰，隨時可使用<strong>「復原」</strong>或<strong>「+試管」</strong>慢慢放鬆探索。</li>
            </ul>
            <button class="btn-primary modal-close-btn-action">開始調色</button>
        </div>
    </div>

    <!-- Game Scripts -->
    <script src="js/colors.js?v=macaron_20260921_1"></script>
    <script src="js/audio.js?v=macaron_20260921_1"></script>
    <script src="js/levels.js?v=macaron_20260921_1"></script>
    <script src="js/game.js?v=macaron_20260921_1"></script>
    <script src="js/ui.js?v=macaron_20260921_1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const game = new WatercolorGame();
            const ui = new WatercolorUI(game);
            game.init(ui);

            // Close modal button action
            document.querySelector('.modal-close-btn-action')?.addEventListener('click', () => {
                document.getElementById('helpModal')?.classList.add('hidden');
            });

            // Start BGM on first user interaction anywhere
            const startAudioOnFirstClick = () => {
                game.audio.init();
                game.audio.startBgm();
                window.removeEventListener('pointerdown', startAudioOnFirstClick);
                window.removeEventListener('keydown', startAudioOnFirstClick);
            };
            window.addEventListener('pointerdown', startAudioOnFirstClick);
            window.addEventListener('keydown', startAudioOnFirstClick);
        });
    </script>
</body>
</html>
