<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Graph Paper Pattern -->
    <pattern id="graphPaper" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(185, 168, 145, 0.28)" stroke-width="1"/>
    </pattern>
    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#524338" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Graph Paper -->
  <rect width="400" height="240" fill="#F7F3E9"/>
  <rect width="400" height="240" fill="url(#graphPaper)"/>

  <!-- Main Board Container -->
  <g transform="translate(110, 16)" filter="url(#softShadow)">
    <rect x="0" y="0" width="180" height="190" rx="14" fill="#F1ECE1" stroke="#524338" stroke-width="2.5"/>

    <!-- Grid Empty Cells (5x5 display for cute minimalism) -->
    <g transform="translate(10, 10)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="28" height="28" rx="5" fill="#FAF7EF" stroke="rgba(185, 168, 145, 0.35)"/>
      <rect x="33" y="0" width="28" height="28" rx="5" fill="#FAF7EF" stroke="rgba(185, 168, 145, 0.35)"/>
      <!-- Falling Block Ghost/Trajectory in Col 2 & 3 -->
      <rect x="66" y="0" width="28" height="28" rx="5" fill="rgba(149, 213, 178, 0.15)" stroke="rgba(149, 213, 178, 0.4)"/>
      <rect x="99" y="0" width="28" height="28" rx="5" fill="rgba(149, 213, 178, 0.15)" stroke="rgba(149, 213, 178, 0.4)"/>
      <rect x="132" y="0" width="28" height="28" rx="5" fill="#FAF7EF" stroke="rgba(185, 168, 145, 0.35)"/>

      <!-- Row 1 -->
      <rect x="0" y="33" width="28" height="28" rx="5" fill="#FAF7EF" stroke="rgba(185, 168, 145, 0.35)"/>
      <rect x="33" y="33" width="28" height="28" rx="5" fill="#FAF7EF" stroke="rgba(185, 168, 145, 0.35)"/>
      <rect x="66" y="33" width="28" height="28" rx="5" fill="rgba(149, 213, 178, 0.15)" stroke="rgba(149, 213, 178, 0.4)"/>
      <rect x="99" y="33" width="28" height="28" rx="5" fill="rgba(149, 213, 178, 0.15)" stroke="rgba(149, 213, 178, 0.4)"/>
      <rect x="132" y="33" width="28" height="28" rx="5" fill="#FAF7EF" stroke="rgba(185, 168, 145, 0.35)"/>

      <!-- Falling Down Indicator Arrow -->
      <path d="M 96 24 L 96 68 M 90 60 L 96 70 L 102 60" fill="none" stroke="#4A8B71" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/>

      <!-- Row 2: Falling Block Landing Ghost -->
      <rect x="0" y="66" width="28" height="28" rx="5" fill="#FAF7EF" stroke="rgba(185, 168, 145, 0.35)"/>
      <rect x="33" y="66" width="28" height="28" rx="5" fill="#FAF7EF" stroke="rgba(185, 168, 145, 0.35)"/>
      <!-- Dropping Shape (Vanilla Yellow 2x1) with Star Icon -->
      <g transform="translate(66, 66)">
        <rect x="0" y="0" width="28" height="28" rx="6" fill="#F6D887"/>
        <path fill="rgba(82,67,56,0.38)" d="M 14 6 L 16 12 L 22 14 L 16 16 L 14 22 L 12 16 L 6 14 L 12 12 Z"/>
        
        <rect x="33" y="0" width="28" height="28" rx="6" fill="#F6D887"/>
        <path fill="rgba(82,67,56,0.38)" d="M 47 6 L 49 12 L 55 14 L 49 16 L 47 22 L 45 16 L 39 14 L 45 12 Z"/>
      </g>
      <rect x="132" y="66" width="28" height="28" rx="5" fill="#FAF7EF" stroke="rgba(185, 168, 145, 0.35)"/>

      <!-- Row 3: Bottom Placed Blocks with Icon Symbols -->
      <!-- Pistachio Green with Circle Icon -->
      <rect x="0" y="99" width="28" height="28" rx="6" fill="#95D5B2"/>
      <circle cx="14" cy="113" r="5" fill="rgba(82,67,56,0.35)"/>

      <rect x="33" y="99" width="28" height="28" rx="6" fill="#95D5B2"/>
      <circle cx="47" cy="113" r="5" fill="rgba(82,67,56,0.35)"/>

      <!-- Rose Pink with Diamond Icon -->
      <rect x="66" y="99" width="28" height="28" rx="6" fill="#F8B4B4"/>
      <polygon points="80,104 88,113 80,122 72,113" fill="rgba(82,67,56,0.35)"/>

      <rect x="99" y="99" width="28" height="28" rx="6" fill="#F8B4B4"/>
      <polygon points="113,104 121,113 113,122 105,113" fill="rgba(82,67,56,0.35)"/>

      <!-- Mist Blue with Square Icon -->
      <rect x="132" y="99" width="28" height="28" rx="6" fill="#95B8D1"/>
      <rect x="140" y="106" width="12" height="12" rx="2" fill="rgba(82,67,56,0.35)"/>

      <!-- Row 4: Filled Base Row -->
      <rect x="0" y="132" width="28" height="28" rx="6" fill="#CDB4DB"/>
      <circle cx="14" cy="146" r="6" fill="none" stroke="rgba(82,67,56,0.35)" stroke-width="2"/>
      <circle cx="14" cy="146" r="2" fill="rgba(82,67,56,0.35)"/>

      <rect x="33" y="132" width="28" height="28" rx="6" fill="#CDB4DB"/>
      <circle cx="47" cy="146" r="6" fill="none" stroke="rgba(82,67,56,0.35)" stroke-width="2"/>
      <circle cx="47" cy="146" r="2" fill="rgba(82,67,56,0.35)"/>

      <rect x="66" y="132" width="28" height="28" rx="6" fill="#F7B267"/>
      <polygon points="80,138 87,152 73,152" fill="rgba(82,67,56,0.35)"/>

      <rect x="99" y="132" width="28" height="28" rx="6" fill="#F7B267"/>
      <polygon points="113,138 120,152 106,152" fill="rgba(82,67,56,0.35)"/>

      <rect x="132" y="132" width="28" height="28" rx="6" fill="#E7A99E"/>
      <path fill="rgba(82,67,56,0.35)" d="M 143 138 h 6 v 5 h 5 v 6 h -5 v 5 h -6 v -5 h -5 v -6 h 5 z"/>
    </g>
  </g>

  <!-- Left Side: Cute Stationery Floating Badges -->
  <g transform="translate(24, 60)">
    <!-- Xylophone Tone Tag -->
    <rect x="0" y="0" width="68" height="26" rx="8" fill="#FFFEFA" stroke="#524338" stroke-width="1.8"/>
    <text x="34" y="17" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#2A2421" text-anchor="middle">♪ C-D-E-F</text>

    <!-- Sparkle Stars -->
    <path fill="#F6D887" d="M 28 42 L 30 47 L 35 49 L 30 51 L 28 56 L 26 51 L 21 49 L 26 47 Z"/>
    <circle cx="48" cy="46" r="2.5" fill="#95D5B2"/>
    <path fill="#F8B4B4" d="M 15 75 L 17 80 L 22 82 L 17 84 L 15 89 L 13 84 L 8 82 L 13 80 Z"/>
  </g>

  <!-- Right Side: Drop Mode Indicator -->
  <g transform="translate(310, 60)">
    <rect x="0" y="0" width="66" height="48" rx="10" fill="#FFFEFA" stroke="#524338" stroke-width="1.8"/>
    <text x="33" y="20" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11" fill="#4A8B71" text-anchor="middle">DROP ↓</text>
    <text x="33" y="36" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9" fill="#786C65" text-anchor="middle">10×10 &amp; 8×8</text>

    <circle cx="20" cy="70" r="3" fill="#F7B267"/>
    <path fill="#CDB4DB" d="M 45 72 L 47 76 L 51 78 L 47 80 L 45 84 L 43 80 L 39 78 L 43 76 Z"/>
  </g>
</svg>
