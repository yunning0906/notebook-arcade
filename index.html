<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notebook Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. LOBBY VIEW -->
    <div id="lobbyView" class="lobby-view">
        <div class="lobby-container">
            <!-- Header Banner -->
            <header class="lobby-header">
                <h1 class="portal-title">NOTEBOOK<br>ARCADE</h1>
                <p class="portal-subtitle">Select a game to view rules and play</p>
            </header>

            <!-- 4 Game Cards (Pure English) -->
            <main class="games-grid">
                <!-- Game 1: Suika Game -->
                <article class="game-card" data-game="suika">
                    <div class="card-media">
                        <img src="assets/suika-preview.png" alt="Suika Game" class="preview-img">
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2 class="card-title">Suika Game</h2>
                        </div>
                        <div class="card-footer">
                            <button class="btn-rules" data-target="suika" aria-label="西瓜遊戲 遊戲規則">
                                <span>遊戲規則</span>
                            </button>
                            <button class="btn-play" data-target="suika" aria-label="Play Suika Game">
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                </article>

                <!-- Game 2: 2048 -->
                <article class="game-card" data-game="2048">
                    <div class="card-media">
                        <img src="assets/2048-preview.png" alt="2048" class="preview-img">
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2 class="card-title">2048</h2>
                        </div>
                        <div class="card-footer">
                            <button class="btn-rules" data-target="2048" aria-label="2048 遊戲規則">
                                <span>遊戲規則</span>
                            </button>
                            <button class="btn-play" data-target="2048" aria-label="Play 2048">
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                </article>

                <!-- Game 3: Bubble Shooter -->
                <article class="game-card" data-game="bubble">
                    <div class="card-media">
                        <img src="assets/bubble-preview.png" alt="Bubble Shooter" class="preview-img">
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2 class="card-title">Bubble Shooter</h2>
                        </div>
                        <div class="card-footer">
                            <button class="btn-rules" data-target="bubble" aria-label="泡泡射擊 遊戲規則">
                                <span>遊戲規則</span>
                            </button>
                            <button class="btn-play" data-target="bubble" aria-label="Play Bubble Shooter">
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                </article>

                <!-- Game 4: One Line -->
                <article class="game-card" data-game="oneline">
                    <div class="card-media">
                        <img src="assets/oneline-preview.png" alt="One Line" class="preview-img">
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2 class="card-title">One Line</h2>
                        </div>
                        <div class="card-footer">
                            <button class="btn-rules" data-target="oneline" aria-label="一筆畫 遊戲規則">
                                <span>遊戲規則</span>
                            </button>
                            <button class="btn-play" data-target="oneline" aria-label="Play One Line">
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                </article>

                <!-- Game 5: Block Puzzle -->
                <article class="game-card" data-game="block">
                    <div class="card-media">
                        <img src="assets/block-preview.png" alt="Block Puzzle" class="preview-img">
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2 class="card-title">Block Puzzle</h2>
                        </div>
                        <div class="card-footer">
                            <button class="btn-rules" data-target="block" aria-label="方塊拼圖 遊戲規則">
                                <span>遊戲規則</span>
                            </button>
                            <button class="btn-play" data-target="block" aria-label="Play Block Puzzle">
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                </article>

                <!-- Game 6: Nonogram -->
                <article class="game-card" data-game="nonogram">
                    <div class="card-media">
                        <img src="assets/nonogram-preview.png" alt="Nonogram Picross" class="preview-img">
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2 class="card-title">Nonogram</h2>
                        </div>
                        <div class="card-footer">
                            <button class="btn-rules" data-target="nonogram" aria-label="數織 遊戲規則">
                                <span>遊戲規則</span>
                            </button>
                            <button class="btn-play" data-target="nonogram" aria-label="Play Nonogram">
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                </article>

                <!-- Game 7: Doodle Snake -->
                <article class="game-card" data-game="snake">
                    <div class="card-media">
                        <img src="assets/snake-preview.png" alt="Doodle Snake" class="preview-img">
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2 class="card-title">Doodle Snake</h2>
                        </div>
                        <div class="card-footer">
                            <button class="btn-rules" data-target="snake" aria-label="手繪毛毛蟲 遊戲規則">
                                <span>遊戲規則</span>
                            </button>
                            <button class="btn-play" data-target="snake" aria-label="Play Doodle Snake">
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                </article>

                <!-- Game 8: Garden Sweeper -->
                <article class="game-card" data-game="garden">
                    <div class="card-media">
                        <img src="assets/garden-preview.png" alt="Garden Sweeper" class="preview-img">
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2 class="card-title">Garden Sweeper</h2>
                        </div>
                        <div class="card-footer">
                            <button class="btn-rules" data-target="garden" aria-label="花園掃雷 遊戲規則">
                                <span>遊戲規則</span>
                            </button>
                            <button class="btn-play" data-target="garden" aria-label="Play Garden Sweeper">
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                </article>

                <!-- Game 9: Paper Tiles -->
                <article class="game-card" data-game="tile">
                    <div class="card-media">
                        <img src="assets/tile-match-preview.png" alt="Paper Tiles" class="preview-img">
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2 class="card-title">Paper Tiles</h2>
                        </div>
                        <div class="card-footer">
                            <button class="btn-rules" data-target="tile" aria-label="卡牌三消 遊戲規則">
                                <span>遊戲規則</span>
                            </button>
                            <button class="btn-play" data-target="tile" aria-label="Play Paper Tiles">
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                </article>

                <!-- Game 10: Watercolor Sort -->
                <article class="game-card" data-game="watercolor">
                    <div class="card-media">
                        <img src="assets/watercolor-preview.png" alt="Watercolor Sort" class="preview-img">
                    </div>
                    <div class="card-content">
                        <div class="card-title-row">
                            <h2 class="card-title">Watercolor Sort</h2>
                        </div>
                        <div class="card-footer">
                            <button class="btn-rules" data-target="watercolor" aria-label="水彩試管 遊戲規則">
                                <span>遊戲規則</span>
                            </button>
                            <button class="btn-play" data-target="watercolor" aria-label="Play Watercolor Sort">
                                <span>PLAY</span>
                            </button>
                        </div>
                    </div>
                </article>
            </main>
        </div>
    </div>

    <!-- 2. 遊戲規則彈窗 (純繁體中文，無英文) -->
    <div id="instructionModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <h3 class="modal-game-title" id="modalGameTitle">遊戲規則</h3>
                </div>
            </div>
            
            <div class="modal-body" id="modalGameContent">
                <!-- 動態注入純中文遊戲說明 -->
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="btnCancelModal">
                    <span>關閉</span>
                </button>
                <button class="btn btn-primary" id="btnConfirmStart">
                    <span>開始遊玩</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 3. GAME PLAYER VIEW (簡約純粹：單一返回大廳箭頭按鈕) -->
    <div id="gamePlayerView" class="game-player-view hidden">
        <!-- Floating Back Arrow (回去的箭頭) -->
        <button class="btn-back-lobby" id="btnBackToLobby" title="返回遊戲大廳" aria-label="返回遊戲大廳">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>返回大廳</span>
        </button>

        <!-- Main Iframe Container -->
        <div class="iframe-container">
            <iframe id="gameFrame" src="about:blank" title="Active Game Viewport" allow="autoplay; fullscreen"></iframe>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/portal.js"></script>
</body>
</html>
